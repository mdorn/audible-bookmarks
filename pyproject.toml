[project]
name = "audible-bookmarks"
version = "0.1.0"
description = "Transcribe the clips and bookmarks from your Audible audiobooks locally with Whisper"
readme = "README.md"
authors = [
    { name = "Matt Dorn", email = "matt.dorn@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "audible[cryptography]>=0.12.0",
    "av>=18.1.0",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.3",
]

[project.scripts]
audible-bookmarks = "audible_bookmarks.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.1",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyrefly]
project-includes = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["audible_bookmarks"]
